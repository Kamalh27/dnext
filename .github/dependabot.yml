version: 2
updates:
  # Minor and patch updates arrive as one pull request per ecosystem so they can be reviewed together.
  - package-ecosystem: pip
    directory: /apps/api
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      python-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      web-minor-patch:
        update-types: [minor, patch]
  # Runtime images stay on the versions the app is tested with (Python 3.12, Node 22 LTS). Newer majors are moved by hand after a test run.
  - package-ecosystem: docker
    directory: /apps/api
    schedule: { interval: monthly }
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
  - package-ecosystem: docker
    directory: /apps/web
    schedule: { interval: monthly }
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
