[project]
name = "landslidewatch-api"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "google-adk==2.12.*",
  "fastapi>=0.135",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.14.1,<3",
  "pydantic-settings>=2.15.0",
  "pyyaml>=6",
  "earthengine-api>=1.5",
  "google-cloud-firestore>=2.19",
  "google-cloud-storage>=3.17.0",
  "slowapi>=0.1.9",
  "rapidfuzz>=3.14.6",
  "httpx>=0.27",
  "google-cloud-bigquery>=3.25",
  "google-cloud-pubsub>=2.42.0",
]
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1.4.0"]
scripts = [
    "geopandas>=1.2.0",
    "osmium>=4.3.1",
    "pyogrio>=0.13.0",
    "rasterio>=1.5.2",
    "shapely>=2.2.0",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = '-m "not integration"'   # cloud-calling tests run via `just test-ee` (-m integration)
pythonpath = ["."]
testpaths = ["tests", "../../evals"]
markers = ["integration: needs real Earth Engine (EE_PROJECT + credentials)"]
