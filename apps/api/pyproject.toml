[project]
name = "landslidewatch-api"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "google-adk==2.11.*",
  "fastapi>=0.135",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.4",
  "pyyaml>=6",
  "earthengine-api>=1.5",
  "google-cloud-firestore>=2.19",
  "google-cloud-storage>=2.18",
  "slowapi>=0.1.9",
  "rapidfuzz>=3.9",
  "httpx>=0.27",
]
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
