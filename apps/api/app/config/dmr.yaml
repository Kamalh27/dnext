# DMR landslide-risk method (ADPC / DMR). Risk = Trigger x Susceptibility x Vulnerability x Exposure / 125  -> 0..5
# Layer paths are project-specific and live in dmr_assets.local.yaml (gitignored; template: dmr_assets.local.yaml.example).
assets:
  boundary: ""
  thresholds: ""
  susceptibility: ""
  vulnerability: ""
  exposure: ""
  thailand_adm1: WM/geoLab/geoBoundaries/600/ADM1   # filtered to shapeGroup THA: border mask for layers whose source covers neighbouring countries

susceptibility_threshold: 10      # pixels below this are "not susceptible" (masked)

# Susceptibility classes: z-score ("Standardize") method on pixels >= threshold.
# mean/stddev are NATIONAL stats of susceptibility >= 10 (computed 2026-10-13 at 1 km; rerun scripts/dmr_stats.py if the map is updated).
susceptibility_zscore:
  mean: 41.379
  stddev: 19.861
  k: [-1.5, -0.5, 0.5, 1.5]       # class breaks at mean + k*sd -> 5 classes

# class = ceil(value * multiplier), clamped 1..5. Chosen from national ranges (vulnerability max 0.50 -> x10; exposure max 0.82 -> x5).
scaling:
  vulnerability_multiplier: 10
  exposure_multiplier: 5

trigger:
  window_days: 30
  # Tambon thresholds (30-day rainfall, mm). Trigger class = highest threshold exceeded (P60->1 ... P95->5); below P60 -> 0.
  columns: [P60max, P70max, P80max, P90max, P95max]
  observed_source: gsmap          # gsmap | imerg. The DMR thresholds were derived from GSMaP, so gsmap is the consistent choice.
  forecast_source: gfs            # NOAA/GFS0P25 (IMERG is observation-only, no forecast)

risk:
  divisor: 125
  # Risk value bins -> class 1..5 (class >= high_from counts as "high" for exposure statistics)
  cutoffs: [1, 2, 3, 4]
  class_names: [Very low, Low, Moderate, High, Very high]
  class_names_th: [ต่ำมาก, ต่ำ, ปานกลาง, สูง, สูงมาก]
  class_colors: ["#ffffb2", "#fecc5c", "#fd8d3c", "#f03b20", "#bd0026"]
  high_from: 4                    # class 4+ = risk value >= 3  ("High")
  # Exposure statistics count people / area in an "elevated" zone: class >= exposure_from (3 = Moderate and up = risk value >= 2).
  # Chosen because at national class breaks almost no pixel reaches "High" (Nan peaks at ~2.4 even with 300 mm), so a High-only
  # count would read as 0 for most provinces.
  exposure_from: 3

layers:
  rain: {name: "Rainfall, 30-day total (mm)", name_th: "ปริมาณฝนสะสม 30 วัน (มม.)", palette: ["f7fbff", "c6dbef", "9ecae1", "3182bd", "08519c"], min: 0, max: 500}
  trigger: {name: "Rainfall trigger class (tambon)", name_th: "ระดับตัวกระตุ้นจากฝน (ระดับตำบล)", palette: ["d9d9d9", "ffffb2", "fecc5c", "fd8d3c", "f03b20", "bd0026"], min: 0, max: 5}
  susceptibility: {name: "Susceptibility class (1-5)", name_th: "ระดับความอ่อนไหว (1-5)", palette: ["1a9641", "a6d96a", "ffffbf", "fdae61", "d7191c"], min: 1, max: 5}
  vulnerability: {name: "Vulnerability class (1-5)", name_th: "ระดับความเปราะบาง (1-5)", palette: ["1a9641", "a6d96a", "ffffbf", "fdae61", "d7191c"], min: 1, max: 5}
  exposure: {name: "Exposure class (1-5)", name_th: "ระดับการรับสัมผัส (1-5)", palette: ["1a9641", "a6d96a", "ffffbf", "fdae61", "d7191c"], min: 1, max: 5}
  population: {name: "Population (WorldPop 2020, per hectare)", name_th: "ประชากร (WorldPop 2020 ต่อเฮกตาร์)", palette: ["3288bd", "66c2a5", "abdda4", "fee08b", "fdae61", "f46d43"], min: 1, max: 6,
          breaks: [0.5, 2, 5, 10, 20, 40]}   # discrete classes of people per hectare (one WorldPop 100 m pixel ~ 1 ha); legend labels come from these
  risk: {name: "Landslide risk (0-5)", name_th: "ความเสี่ยงดินถล่ม (0-5)", palette: ["ffffb2", "fecc5c", "fd8d3c", "f03b20", "bd0026"], min: 0, max: 5}
