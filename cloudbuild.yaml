substitutions:
  _REGION: asia-southeast1
  _REPO: lw
  _API_URL: ""            # set after first api deploy
  _MAPS_KEY: ""
  _MAP_ID: ""
  _WEB_URL: "*"            # set to the web Cloud Run URL after first deploy (CORS)
steps:
  - {name: gcr.io/cloud-builders/docker, args: [build, -t, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$SHORT_SHA", apps/api]}
  - {name: gcr.io/cloud-builders/docker, args: [push, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$SHORT_SHA"]}
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args: [run, deploy, lw-api, --image, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$SHORT_SHA",
           --region, "${_REGION}", --service-account, "landslide-api@$PROJECT_ID.iam.gserviceaccount.com",
           --allow-unauthenticated, --min-instances=1, --cpu-boost, --timeout=300,
           "--set-env-vars=GEO_BACKEND=ee,EE_PROJECT=$PROJECT_ID,GOOGLE_GENAI_USE_VERTEXAI=true,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=global,ALLOWED_ORIGINS=${_WEB_URL}",
           "--set-secrets=GOOGLE_MAPS_SERVER_KEY=maps-server-key:latest"]
  - {name: gcr.io/cloud-builders/docker, args: [build, -t, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$SHORT_SHA",
      --build-arg, "NEXT_PUBLIC_API_BASE_URL=${_API_URL}", --build-arg, "NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${_MAPS_KEY}",
      --build-arg, "NEXT_PUBLIC_GOOGLE_MAP_ID=${_MAP_ID}", apps/web]}
  - {name: gcr.io/cloud-builders/docker, args: [push, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$SHORT_SHA"]}
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args: [run, deploy, lw-web, --image, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$SHORT_SHA",
           --region, "${_REGION}", --allow-unauthenticated]
