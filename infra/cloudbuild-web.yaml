# Build + deploy the web app. NEXT_PUBLIC_* values are baked at build time (they are public by design).
substitutions:
  _MIN_INSTANCES: "1"        # keeps one instance warm so the first visit after a quiet period is not slow
  _WEB_SA: ""                # web runtime service account email; deploy.sh passes it
  _REGION: asia-southeast1
  _REPO: dnext
  _API_URL: ""
  _MAPS_KEY: ""
  _MAP_ID: ""
  _FEEDBACK_URL: ""
options:
  logging: CLOUD_LOGGING_ONLY
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$BUILD_ID
      - --build-arg=NEXT_PUBLIC_API_BASE_URL=${_API_URL}
      - --build-arg=NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${_MAPS_KEY}
      - --build-arg=NEXT_PUBLIC_GOOGLE_MAP_ID=${_MAP_ID}
      - --build-arg=NEXT_PUBLIC_FEEDBACK_FORM_URL=${_FEEDBACK_URL}
      - apps/web
  - name: gcr.io/cloud-builders/docker
    args: [push, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$BUILD_ID"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args: [run, deploy, dnext-web, "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$BUILD_ID",
           "--region=${_REGION}", "--service-account=${_WEB_SA}", --allow-unauthenticated, --cpu=1, --memory=512Mi, "--min-instances=${_MIN_INSTANCES}", --max-instances=5]
